name: ci

on:
  push:
    branches: [main]
  pull_request:


# `go.mod` requires `go 1.27` with `toolchain go1.27rc2`: `crypto/mldsa` (FIPS
# 204) exists only in the pre-release toolchain, and taking it over a
# third-party crypto library was a decision the user approved directly.
#
# The version below is that same release candidate written the way setup-go
# wants it. Go calls it `go1.27rc2`; the action takes a semver spec and maps
# `1.27.0-rc.2` onto it. Passing Go's own spelling (which is what
# `go-version-file: go.mod` hands over) fails: the action looks for a manifest
# entry, finds none, and its direct download rejects the string.
#
# Until 1 August 2026 this said `1.26.5` while go.mod said 1.27, and Go quietly
# downloaded the RC underneath every job. setup-go v6 began pinning
# GOTOOLCHAIN=local, which turned that silent disagreement into a hard failure
# and is the only reason it was found.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0-rc.2"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: every direct dependency is declared with a reason
        run: ./scripts/declared-deps.sh

      # A scanner asks to be believed about somebody else's cryptography. The
      # honest answer to "why should I trust your binary" is not that the source
      # is open, which it always was, but that you can rebuild the release and
      # get the same bytes. Measured 2026-08-05: the published
      # qryx_v0.3.0_darwin_arm64, built on a runner, and a local build of the
      # same tag on macOS are both
      # 0864315d02b8580b56cb997e31b2bcef1bb804f4713981c0fae424ace3303c2b.
      #
      # That holds because of CGO_ENABLED=0, -trimpath and -s -w in the release
      # workflow, and any one of them going missing breaks it in silence: the
      # build still succeeds and only the person trying to verify us finds out.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0-rc.2"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0-rc.2"
          cache: true
      - name: integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: go test -tags=integration ./internal/store/...
