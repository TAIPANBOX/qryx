name: ci

on:
  push:
    branches: [main]
  pull_request:


# `go.mod` requires `go 1.27` with `toolchain go1.27.0`: `crypto/mldsa` (FIPS
# 204) is stdlib as of 1.27, and taking it over a third-party crypto library
# was a decision the user approved directly.
#
# The version below is that same toolchain, and since GA it is spelled the same
# way by Go and by setup-go.
#
# This one line has been wrong twice, in opposite directions. Until 1 August
# 2026 it said `1.26.5` while go.mod said 1.27, and Go quietly downloaded the
# newer toolchain underneath every job; setup-go v6 began pinning
# GOTOOLCHAIN=local, which turned that silent disagreement into a hard failure
# and is the only reason it was found. From then until 20 August 2026 it said
# `1.27.0-rc.2`, because `crypto/mldsa` existed only in the release candidate:
# Go spells that toolchain `go1.27rc2`, setup-go accepts only the semver form,
# and the two spellings had to be kept in sync by hand. Go 1.27.0 GA closed
# both problems at once.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...

      # This repository was the only Go one in the estate with no staticcheck
      # at all, which was invisible: its CI has more steps than most, so the
      # gap read as thoroughness. On 2026-08-28 the same analyser, restored to
      # costcrew after being wrongly removed, found three real defects there
      # in its first run.
      #
      # 2026.2.1 is also the first release that understands Go 1.27, which this
      # repository requires for `crypto/mldsa`; 2026.1 could not have checked
      # it at all.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: every direct dependency is declared with a reason
        run: ./scripts/declared-deps.sh

      # A number in a README is a claim with no owner: it is right the day it
      # is written and the suite grows in a commit that never opens the file.
      # On 2026-08-05 four of seven such figures on it-rat.com were found
      # stale against these repositories. This is the same check at the source.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh

      # A scenario with no test is a paragraph about what somebody wanted, and
      # a binding pointing at a renamed test is worse: it reads as held.
      - name: every scenario names a test that exists
        run: ./scripts/features-are-bound.sh

      # A scanner asks to be believed about somebody else's cryptography. The
      # honest answer to "why should I trust your binary" is not that the source
      # is open, which it always was, but that you can rebuild the release and
      # get the same bytes. Measured 2026-08-05: the published
      # qryx_v0.3.0_darwin_arm64, built on a runner, and a local build of the
      # same tag on macOS are both
      # 0864315d02b8580b56cb997e31b2bcef1bb804f4713981c0fae424ace3303c2b.
      #
      # That holds because of CGO_ENABLED=0, -trimpath and -s -w in the release
      # workflow, and any one of them going missing breaks it in silence: the
      # build still succeeds and only the person trying to verify us finds out.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: go test -tags=integration ./internal/store/...
