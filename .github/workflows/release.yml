name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write


# `go.mod` requires `go 1.27` with `toolchain go1.27rc2`: `crypto/mldsa` (FIPS
# 204) exists only in the pre-release toolchain, and taking it over a
# third-party crypto library was a decision the user approved directly.
#
# The version below is that same release candidate written the way setup-go
# wants it. Go calls it `go1.27rc2`; the action takes a semver spec and maps
# `1.27.0-rc.2` onto it. Passing Go's own spelling (which is what
# `go-version-file: go.mod` hands over) fails: the action looks for a manifest
# entry, finds none, and its direct download rejects the string.
#
# Until 1 August 2026 this said `1.26.5` while go.mod said 1.27, and Go quietly
# downloaded the RC underneath every job. setup-go v6 began pinning
# GOTOOLCHAIN=local, which turned that silent disagreement into a hard failure
# and is the only reason it was found.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0-rc.2"
          cache: true

      - name: build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="qryx_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}/qryx${ext}" ./cmd/qryx
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out}.zip" "${out}")
            else
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "qryx ${GITHUB_REF_NAME}" --generate-notes
