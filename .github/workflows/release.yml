name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write


# `go.mod` requires `go 1.27` with `toolchain go1.27rc2`: `crypto/mldsa` (FIPS
# 204) exists only in the pre-release toolchain, and taking it over a
# third-party crypto library was a decision the user approved directly.
#
# The version below is that same release candidate written the way setup-go
# wants it. Go calls it `go1.27rc2`; the action takes a semver spec and maps
# `1.27.0-rc.2` onto it. Passing Go's own spelling (which is what
# `go-version-file: go.mod` hands over) fails: the action looks for a manifest
# entry, finds none, and its direct download rejects the string.
#
# Until 1 August 2026 this said `1.26.5` while go.mod said 1.27, and Go quietly
# downloaded the RC underneath every job. setup-go v6 began pinning
# GOTOOLCHAIN=local, which turned that silent disagreement into a hard failure
# and is the only reason it was found.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0-rc.2"
          cache: true

      - name: build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            # The asset NAME carries no version, deliberately, and putting one back
            # breaks something outside this repository. it-rat.com links straight to
            # https://github.com/TAIPANBOX/qryx/releases/latest/download/<this name>,
            # which resolves only while the name is stable. A version here turns
            # every download link on that site into a 404 at the next tag, silently,
            # and the person who finds out is somebody trying to install this.
            #
            # The version is not lost. It is stamped INTO the binary by
            # -X main.version below, which is where `qryx version` reads it from
            # and the harder of the two places to fake: a filename can be renamed by
            # anyone between us and the reader.
            out="qryx_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}/qryx${ext}" ./cmd/qryx
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out}.zip" "${out}")
            else
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "qryx ${GITHUB_REF_NAME}" --generate-notes

  # The image, published from the SAME tag as the binaries above rather than
  # from its own, so "which version am I running" has one answer whether the
  # answer came from a tarball or from a registry. Immutable: no `:latest`, no
  # `:main` (Yurii, 2026-08-02).
  image:
    name: build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qryx
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "platforms: linux/amd64, linux/arm64"
