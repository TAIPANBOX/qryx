name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# go.mod requires `go 1.27` with `toolchain go1.27rc2`, because `crypto/mldsa`
# (FIPS 204) exists only in the pre-release toolchain and taking it over a
# third-party crypto library was a decision the user approved directly.
#
# setup-go cannot install that: its manifest stops at 1.26.5, and Go names the
# release candidate `go1.27rc2` rather than the `1.27.0-rc.2` the action's
# direct-download fallback expects. So the step below installs the newest stable
# as a bootstrap and Go's own toolchain mechanism fetches what go.mod names.
#
# GOTOOLCHAIN is set here rather than left to default ON PURPOSE. That fetch is
# exactly what happened before, silently, while every job reported it was
# testing on 1.26.5. setup-go v6 began pinning GOTOOLCHAIN=local, which turned
# the silent disagreement into a hard failure and is how it was found. Written
# down, it is a decision; left to a default, it was a lie in the config.
env:
  GOTOOLCHAIN: auto

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"  # bootstrap; go.mod upgrades this to go1.27rc2
          cache: true

      - name: build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="qryx_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}/qryx${ext}" ./cmd/qryx
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out}.zip" "${out}")
            else
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "qryx ${GITHUB_REF_NAME}" --generate-notes
